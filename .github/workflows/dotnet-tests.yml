
name: CreditFlow - Tests

"on":
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  tests:
    name: Run .NET Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore ./CreditFlow.Tests/CreditFlow.Tests.csproj

      - name: Build project
        run: dotnet build ./CreditFlow.Tests/CreditFlow.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ./CreditFlow.Tests/CreditFlow.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"